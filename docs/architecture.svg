<svg viewBox="0 0 880 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="880" height="480" fill="#faf7f0"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#14110f">ResearchCopilot — Architecture</text>
  <text x="30" y="64" font-size="13" fill="#6b6358" font-family="monospace">local inference + local embeddings · external API only for citation truth-check</text>

  <rect x="30" y="95" width="170" height="80" rx="10" fill="#fff" stroke="#3a5a40" stroke-width="2"/>
  <text x="115" y="125" font-size="14" font-weight="700" fill="#14110f" text-anchor="middle">Single-page UI</text>
  <text x="115" y="145" font-size="11" fill="#6b6358" text-anchor="middle">7 stage panels</text>
  <text x="115" y="161" font-size="11" fill="#6b6358" text-anchor="middle">index.html</text>

  <rect x="270" y="95" width="170" height="80" rx="10" fill="#fff" stroke="#3a5a40" stroke-width="2"/>
  <text x="355" y="125" font-size="14" font-weight="700" fill="#14110f" text-anchor="middle">Flask API</text>
  <text x="355" y="145" font-size="11" fill="#6b6358" text-anchor="middle">app.py</text>
  <text x="355" y="161" font-size="11" fill="#6b6358" text-anchor="middle">9 endpoints</text>

  <rect x="600" y="60" width="180" height="62" rx="10" fill="#e8efe7" stroke="#3a5a40" stroke-width="2"/>
  <text x="690" y="86" font-size="13" font-weight="700" fill="#3a5a40" text-anchor="middle">Ollama · llama3.1:8b</text>
  <text x="690" y="105" font-size="11" fill="#3a5a40" text-anchor="middle">generation (local)</text>

  <rect x="600" y="132" width="180" height="62" rx="10" fill="#e8efe7" stroke="#3a5a40" stroke-width="2"/>
  <text x="690" y="158" font-size="13" font-weight="700" fill="#3a5a40" text-anchor="middle">nomic-embed-text</text>
  <text x="690" y="177" font-size="11" fill="#3a5a40" text-anchor="middle">embeddings (local)</text>

  <rect x="600" y="204" width="180" height="62" rx="10" fill="#fbf4e3" stroke="#bb8a2b" stroke-width="2"/>
  <text x="690" y="230" font-size="13" font-weight="700" fill="#8a6618" text-anchor="middle">CrossRef API</text>
  <text x="690" y="249" font-size="11" fill="#8a6618" text-anchor="middle">citation truth-check</text>

  <line x1="200" y1="135" x2="270" y2="135" stroke="#14110f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="120" x2="600" y2="95" stroke="#3a5a40" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="140" x2="600" y2="160" stroke="#3a5a40" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="155" x2="600" y2="232" stroke="#bb8a2b" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="30" y="300" font-size="13" font-weight="700" fill="#14110f">Capabilities an LLM lacks on its own</text>
  <g font-size="11">
    <rect x="30" y="316" width="200" height="78" rx="8" fill="#fff" stroke="#3a5a40"/>
    <text x="44" y="340" font-weight="700" fill="#3a5a40">retrieve.py + grounded.py</text>
    <text x="44" y="360" fill="#6b6358">PDF → chunks → local embed →</text>
    <text x="44" y="376" fill="#6b6358">answer w/ per-sentence source</text>
    <text x="44" y="390" fill="#6b6358">tags (page-level provenance)</text>

    <rect x="244" y="316" width="200" height="78" rx="8" fill="#fff" stroke="#3a5a40"/>
    <text x="258" y="340" font-weight="700" fill="#3a5a40">contradict.py</text>
    <text x="258" y="360" fill="#6b6358">claim → corpus-wide stance</text>
    <text x="258" y="376" fill="#6b6358">classification + consensus</text>
    <text x="258" y="390" fill="#6b6358">tally across papers</text>

    <rect x="458" y="316" width="200" height="78" rx="8" fill="#fff" stroke="#9b2226"/>
    <text x="472" y="340" font-weight="700" fill="#9b2226">verify.py</text>
    <text x="472" y="360" fill="#6b6358">existence (CrossRef) +</text>
    <text x="472" y="376" fill="#6b6358">attribution (DOI metadata) +</text>
    <text x="472" y="390" fill="#6b6358">numeric consistency</text>

    <rect x="672" y="316" width="178" height="78" rx="8" fill="#fff" stroke="#bb8a2b"/>
    <text x="686" y="340" font-weight="700" fill="#8a6618">provenance.py</text>
    <text x="686" y="360" fill="#6b6358">model + temp + prompt</text>
    <text x="686" y="376" fill="#6b6358">hash + output SHA-256</text>
    <text x="686" y="390" fill="#6b6358">→ auditable JSONL log</text>
  </g>

  <text x="30" y="436" font-size="11" fill="#6b6358" font-family="monospace">triage.py · ideation.py · draft.py  —  the generative stages, kept honest by the verification + grounding layers above</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#14110f"/></marker></defs>
</svg>
